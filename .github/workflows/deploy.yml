name: Build, Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mzuhairiy/petpals-backend
  FRONTEND_IMAGE: ghcr.io/mzuhairiy/petpals-frontend

jobs:
  # ─── Stage 1: Test Backend ───
  test-backend:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: petpals
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/petpals

      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/petpals
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: test

  # ─── Stage 1b: Build Frontend (verify it compiles) ───
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://staging.petpals-demo.shop
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: Mid-client-TzQ-2Xg8RhB1DUAX

  # ─── Stage 2: Build & Push Docker Images ───
  containerize:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:staging
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & push frontend image (staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:staging
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://staging.petpals-demo.shop
            NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=Mid-client-TzQ-2Xg8RhB1DUAX

  # ─── Stage 3: Deploy to Staging ───
  deploy-staging:
    needs: containerize
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.staging.yml,deploy/nginx/petpals-staging"
          target: "/opt/petpals/staging/"
          strip_components: 1

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/petpals/staging

            # Rename compose file
            mv -f docker-compose.staging.yml docker-compose.yml 2>/dev/null || true

            # Update Nginx config if changed
            if [ -f nginx/petpals-staging ]; then
              sudo cp nginx/petpals-staging /etc/nginx/sites-available/petpals-staging
              sudo ln -sf /etc/nginx/sites-available/petpals-staging /etc/nginx/sites-enabled/petpals-staging
              sudo nginx -t && sudo systemctl reload nginx
              echo "Nginx config updated and reloaded"
            fi

            # Write .env file from secrets
            cat > .env << 'ENVEOF'
            DB_USER=postgres
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DATABASE_URL=postgresql://postgres:${{ secrets.DB_PASSWORD }}@db:5432/petpals_staging?schema=public
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            PORT=5000
            NODE_ENV=staging
            FRONTEND_URL=https://staging.petpals-demo.shop
            MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}
            MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY_SANDBOX }}
            MIDTRANS_IS_PRODUCTION=false
            BITESHIP_API_KEY=${{ secrets.BITESHIP_API_KEY }}
            BITESHIP_IS_PRODUCTION=false
            ENVEOF

            # Login to GHCR
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for backend to be healthy
            echo "Waiting for backend to start..."
            sleep 15

            # Verify health and CORS config
            echo "=== Health Check ==="
            curl -sf http://localhost:5100/health || echo "Health check failed - backend may still be starting"

            echo ""
            echo "=== CORS Test (preflight) ==="
            curl -sf -X OPTIONS http://localhost:5100/api/auth/login \
              -H "Origin: https://staging.petpals-demo.shop" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: Content-Type" \
              -D - -o /dev/null || echo "CORS preflight test failed"

            # Seed database (staging only, idempotent)
            echo ""
            echo "=== Seeding Database ==="
            curl -sf -X POST http://localhost:5100/api/seed \
              -H "Content-Type: application/json" \
              -d '{"secret":"petpals-seed-2024"}' || echo "Seed failed or already seeded"

            # Clean up old images
            docker image prune -f

  # ─── Stage 4: Deploy to Production (manual trigger) ───
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag images for production
        run: |
          # Pull staging images and re-tag as production
          docker pull ${{ env.BACKEND_IMAGE }}:staging
          docker tag ${{ env.BACKEND_IMAGE }}:staging ${{ env.BACKEND_IMAGE }}:production
          docker push ${{ env.BACKEND_IMAGE }}:production

          docker pull ${{ env.FRONTEND_IMAGE }}:staging
          docker tag ${{ env.FRONTEND_IMAGE }}:staging ${{ env.FRONTEND_IMAGE }}:production
          docker push ${{ env.FRONTEND_IMAGE }}:production

      - name: Build & push frontend image (production URLs)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:production
          build-args: |
            NEXT_PUBLIC_API_URL=https://petpals-demo.shop
            NEXT_PUBLIC_MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.production.yml"
          target: "/opt/petpals/production/"
          strip_components: 1

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/petpals/production

            # Rename compose file
            mv -f docker-compose.production.yml docker-compose.yml 2>/dev/null || true

            # Write .env file from secrets
            cat > .env << 'ENVEOF'
            DB_USER=postgres
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DATABASE_URL=postgresql://postgres:${{ secrets.DB_PASSWORD }}@db:5432/petpals_production?schema=public
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            PORT=5000
            NODE_ENV=production
            FRONTEND_URL=${{ secrets.PRODUCTION_URL }}
            MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}
            MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}
            MIDTRANS_IS_PRODUCTION=${{ secrets.MIDTRANS_IS_PRODUCTION }}
            BITESHIP_API_KEY=${{ secrets.BITESHIP_API_KEY }}
            BITESHIP_IS_PRODUCTION=${{ secrets.BITESHIP_IS_PRODUCTION }}
            ENVEOF

            # Login to GHCR
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for backend to be healthy
            echo "Waiting for backend to start..."
            sleep 15
            curl -sf http://localhost:5200/health || echo "Health check failed - backend may still be starting"

            # Clean up old images
            docker image prune -f
