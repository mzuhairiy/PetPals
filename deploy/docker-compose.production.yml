services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: petpals_production
    ports:
      - "5434:5432"
    volumes:
      - pgdata_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/mzuhairiy/petpals-backend:production
    env_file: .env
    ports:
      - "5200:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/mzuhairiy/petpals-frontend:production
    environment:
      API_URL_INTERNAL: http://backend:5000
    ports:
      - "3200:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_production:
