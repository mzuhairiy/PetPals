version: "3.8"

services:
  # ── PostgreSQL Database ──
  # Included for fresh environments (CI, new developers).
  # If you already have PostgreSQL running, use:
  #   docker compose -f docker-compose.yml -f docker-compose.no-db.yml up --build
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: petpals
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Express Backend API ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env.docker
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js Frontend ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
    environment:
      # Server-side API URL (container-to-container via Docker network)
      # This is a runtime env var read by server-side code only
      API_URL_INTERNAL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
